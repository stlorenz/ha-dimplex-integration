read_holding_registers:
  name: Read holding registers
  description: >-
    Read one or more Modbus holding registers from the Dimplex device.
    Use this for ad-hoc inspection or to map registers that are not yet
    exposed as entities.
  fields:
    entry_id:
      name: Config entry
      description: Required if more than one Dimplex entry is configured.
      required: false
      example: 1a2b3c4d
      selector:
        text:
    address:
      name: Register address
      description: 0-based holding register address.
      required: true
      example: 103
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      description: Number of consecutive registers to read.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    unit_id:
      name: Modbus unit / slave ID
      description: Modbus unit ID; defaults to 1.
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

read_input_registers:
  name: Read input registers
  description: Read one or more Modbus input registers.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    address:
      name: Register address
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

write_register:
  name: Write a holding register
  description: >-
    Write a single 16-bit value to a Modbus holding register. Requires the
    "Write Enable" switch to be turned on first.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    address:
      name: Register address
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Value
      description: 16-bit value to write (0..65535).
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

diagnose_registers:
  name: Diagnose registers
  description: >-
    Read every datapoint the integration maps (holding registers and
    coils) once and return raw words, scaled value and a verdict against
    the range documented in the Dimplex wiki. Also reports registers 5
    (flow temperature) and 9 (2nd heating circuit) side by side so the
    mapping can be checked against the WPM Touch display while the
    compressor runs. Anything listed under "problems" needs attention.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

set_time_program:
  name: Set raise/lower time programme
  description: >-
    Write one complete Absenkung/Anhebung time programme of a heating circuit
    in one call (selector register 5065, then block 5066..5081). Requires the
    "Write Enable" switch. Returns the read-back block so you can verify.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    function:
      name: Time function
      description: Which programme to write (circuit + raise/lower).
      required: true
      default: hc2_raise
      selector:
        select:
          options:
            - hc1_lower
            - hc1_raise
            - hc2_lower
            - hc2_raise
            - hc3_lower
            - hc3_raise
    window1_start:
      name: Window 1 start
      required: true
      example: "02:00"
      selector:
        time:
    window1_end:
      name: Window 1 end
      required: true
      example: "06:00"
      selector:
        time:
    window2_start:
      name: Window 2 start
      required: false
      example: "12:00"
      selector:
        time:
    window2_end:
      name: Window 2 end
      required: false
      example: "16:00"
      selector:
        time:
    value:
      name: Raise/lower value
      description: Temperature offset applied inside the windows (K).
      required: true
      default: 4
      selector:
        number:
          min: 0
          max: 19
          unit_of_measurement: K
    weekdays:
      name: Weekdays
      description: Apply both windows, only one window, or disable on all days.
      required: false
      default: both
      selector:
        select:
          options:
            - both
            - window1
            - window2
            - "off"
    readback_delay:
      name: Read-back delay
      description: >-
        Seconds to wait before reading the block back. The WPM validates and
        may rewrite the programme shortly after the write; 5 s is safe.
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

read_time_program:
  name: Read raise/lower time programme
  description: >-
    Select a time function (writes register 5065, so "Write Enable" must be
    on) and return its windows, weekday flags and value.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    function:
      name: Time function
      required: true
      default: hc2_raise
      selector:
        select:
          options:
            - hc1_lower
            - hc1_raise
            - hc2_lower
            - hc2_raise
            - hc3_lower
            - hc3_raise
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box
