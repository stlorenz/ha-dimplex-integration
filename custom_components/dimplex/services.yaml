read_holding_registers:
  name: Read holding registers
  description: >-
    Read one or more Modbus holding registers from the Dimplex device.
    Use this for ad-hoc inspection or to map registers that are not yet
    exposed as entities.
  fields:
    entry_id:
      name: Config entry
      description: Required if more than one Dimplex entry is configured.
      required: false
      example: 1a2b3c4d
      selector:
        text:
    address:
      name: Register address
      description: 0-based holding register address.
      required: true
      example: 103
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      description: Number of consecutive registers to read.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    unit_id:
      name: Modbus unit / slave ID
      description: Modbus unit ID; defaults to 1.
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

read_input_registers:
  name: Read input registers
  description: Read one or more Modbus input registers.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    address:
      name: Register address
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    count:
      name: Count
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 125
          mode: box
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

write_register:
  name: Write a holding register
  description: >-
    Write a single 16-bit value to a Modbus holding register. Requires the
    "Write Enable" switch to be turned on first.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    address:
      name: Register address
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    value:
      name: Value
      description: 16-bit value to write (0..65535).
      required: true
      selector:
        number:
          min: 0
          max: 65535
          mode: box
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box

diagnose_registers:
  name: Diagnose unverified registers
  description: >-
    Read every Modbus register that is currently flagged "UNVERIFIED"
    in the integration's register map and return the raw value plus
    every plausible decode (pressure scale 0.01 vs 0.1, signed vs
    unsigned 16-bit temperature, big-endian vs little-endian for the
    32-bit runtime/energy counters). Run this once against a real
    device and compare to the WPM Touch display to pin down the
    correct register layout.
  fields:
    entry_id:
      name: Config entry
      required: false
      selector:
        text:
    unit_id:
      name: Modbus unit / slave ID
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 247
          mode: box
