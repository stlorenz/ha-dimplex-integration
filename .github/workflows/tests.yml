name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Home Assistant 2026.x requires Python >= 3.13.
        python-version: ["3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_test.txt

    - name: Run tests with pytest
      run: |
        pytest tests/ --cov=custom_components.dimplex --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort

    - name: Run black
      run: black --check custom_components/ tests/ scripts/

    - name: Run isort
      run: isort --check-only custom_components/ tests/ scripts/

    - name: Run ruff
      run: ruff check custom_components/ tests/ scripts/

  # Home Assistant's own integration validator: manifest, strings/translations,
  # services.yaml schema, dependency pins, ...
  hassfest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: home-assistant/actions/hassfest@master

  # HACS repository validator (hacs.json, README, manifest, release layout).
  # "brands" is ignored until a logo is submitted to home-assistant/brands.
  hacs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hacs/action@main
      with:
        category: integration
        ignore: brands
